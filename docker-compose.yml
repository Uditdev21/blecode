services:
  tronn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tronn_data_sync_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persists TinyDB data file on the host machine
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  ble-scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    container_name: tronn_ble_scanner
    restart: unless-stopped
    # Required on Linux for Bluetooth adapter and BlueZ D-Bus access
    network_mode: host
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus
    depends_on:
      - tronn-api
